name: CI

on:
  push:
    branches: ['**']
    # a push that changes only the READMEs or the issue drafts tests nothing new (the roadmap states are pushed often);
    # a push with any other file runs everything
    paths-ignore: ['README.md', 'README.en.md', 'upstream-reports/**']
  pull_request:
  workflow_dispatch:
    inputs:
      prove:
        description: also prove the regression tests on their fixes' parent commits (scripts/prove.mjs)
        type: boolean
        default: false
  # weekly: the whole suite, and the proof of the regression tests (the fixes' commits do not move, the harness does)
  schedule:
    - cron: '17 3 * * 0'
  # the upstream watch (upstream-watch.yml) runs the suite for a new OpenCCU-Base main commit through this workflow
  workflow_call:
    inputs:
      upstream_sha:
        description: the OpenCCU-Base commit to test in place of main
        type: string
        default: ''
      trigger:
        description: what triggered the run, shown on the report
        type: string
        default: ''

jobs:
  unit:
    name: lint and unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit

  # which OpenCCU-Base refs this run tests: the two newest release tags and main's head (or the upstream watch's
  # commit), each with its known-broken list derived from the fixes' merge commits (scripts/resolve-refs.mjs)
  refs:
    name: OpenCCU-Base refs
    runs-on: ubuntu-latest
    outputs:
      daemons: ${{ steps.resolve.outputs.daemons }}
      fuzz: ${{ steps.resolve.outputs.fuzz }}
      prove: ${{ steps.prove.outputs.prove }}
      proof: ${{ steps.prove.outputs.proof }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: resolve
        run: node scripts/resolve-refs.mjs --main "${{ inputs.upstream_sha }}" --github-output
      # the proof of the regression tests costs two image builds per fix, so it runs only when it can change: weekly,
      # on request, and on a push that changes the fix list or a regression test (scripts/prove.mjs changed); never
      # for the upstream watch, whose new main commit does not touch the fixes' old commits
      - id: prove
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          DISPATCH: ${{ github.event.inputs.prove }}
          UPSTREAM: ${{ inputs.upstream_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          prove=false
          if [ -n "${UPSTREAM}" ]; then
            prove=false
          elif [ "${CRON}" = '17 3 * * 0' ] || [ "${DISPATCH}" = true ]; then
            prove=true
          elif [ "${EVENT}" = push ]; then
            if [ -z "${BEFORE}" ] || [ "${BEFORE}" = 0000000000000000000000000000000000000000 ] \
              || ! git fetch -q --depth=1 origin "${BEFORE}"; then
              prove=true
            elif node scripts/prove.mjs changed "${BEFORE}" "${GITHUB_SHA}"; then
              prove=true
            fi
          fi
          echo "prove=${prove}" >> "$GITHUB_OUTPUT"
          if [ "${prove}" = true ]; then
            node scripts/prove.mjs plan --github-output
          fi

  daemons:
    name: daemon suite (OpenCCU-Base ${{ matrix.base_ref }}, ${{ matrix.variant }})
    needs: refs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.refs.outputs.daemons) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build the test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: test
          load: true
          tags: hm-radio-simulator:test
          build-args: |
            BASE_REF=${{ matrix.build_ref }}
            BASE_LABEL=${{ matrix.base_ref }}
            KNOWN_BROKEN=${{ matrix.known_broken }}
          cache-from: type=gha,scope=base-${{ matrix.base_ref }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.base_ref }}
      - name: run the daemon suite
        run: |
          mkdir -p results
          docker run --rm --init --cap-add SYS_NICE -e HMRS_VARIANT=${{ matrix.variant }} -v "$PWD/results:/results" hm-radio-simulator:test npm run test:daemon
      - name: job summary
        if: always()
        run: node scripts/report.mjs summary results >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daemon-results-${{ matrix.base_ref }}-${{ matrix.variant }}
          path: results
          if-no-files-found: ignore

  fuzz:
    name: fuzz (OpenCCU-Base ${{ matrix.base_ref }})
    needs: refs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.refs.outputs.fuzz) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build the fuzz image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: fuzz
          load: true
          tags: hm-radio-simulator:fuzz
          build-args: |
            BASE_REF=${{ matrix.build_ref }}
            BASE_LABEL=${{ matrix.base_ref }}
          cache-from: type=gha,scope=base-${{ matrix.base_ref }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.base_ref }}
      - name: run the harnesses (60 s each)
        run: |
          mkdir -p results/fuzz
          docker run --rm -e FUZZ_SECONDS=60 -e FUZZ_EXPECT_FINDINGS=${{ matrix.expect_findings }} -e FUZZ_KNOWN_HARNESSES=${{ matrix.known_harnesses }} -v "$PWD/results/fuzz:/results" hm-radio-simulator:fuzz
      - name: job summary
        if: always()
        run: node scripts/report.mjs summary results >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-results-${{ matrix.base_ref }}
          path: |
            results/fuzz
            !results/fuzz/corpus
          if-no-files-found: ignore

  # every test needs a short explanation for the report (test/descriptions.js); a test without one fails this job
  descriptions:
    name: every test has a description
    runs-on: ubuntu-latest
    needs: daemons
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: 'daemon-results-*'
      - run: node scripts/report.mjs check artifacts

  # the proof of the regression tests: each fix's tests on its merge commit's parent (they must fail) and on the merge
  # commit (they must pass), release and ASan; the report job judges the runs (scripts/prove.mjs)
  prove:
    name: 'proof (OpenCCU-Base #${{ matrix.fix }}, ${{ matrix.side }})'
    needs: refs
    if: needs.refs.outputs.prove == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.refs.outputs.proof) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@v3
      # no build cache: the old commits would push the refs' caches out of the 10 GB, and the build takes minutes
      - name: build the image at ${{ matrix.sha }}
        id: build
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: test
          load: true
          tags: hm-radio-simulator:proof
          build-args: |
            BASE_REF=${{ matrix.sha }}
            BASE_LABEL=#${{ matrix.fix }} ${{ matrix.side }}
            DAEMON_VARIANTS=release asan
      - name: 'run the tests of #${{ matrix.fix }}'
        run: |
          node scripts/prove.mjs run --fix "${{ matrix.fix }}" --side "${{ matrix.side }}" --sha "${{ matrix.sha }}" \
            --image hm-radio-simulator:proof --out proof --known-broken "${{ matrix.known_broken }}" \
            --repeat "${{ matrix.repeat }}" ${{ steps.build.outcome != 'success' && '--build-failed' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof-${{ matrix.fix }}-${{ matrix.side }}
          path: proof/proof-run.json
          if-no-files-found: ignore

  # the test report: the Markdown overview of the whole run and the static site for GitHub Pages (scripts/report.mjs)
  report:
    name: test report
    runs-on: ubuntu-latest
    needs: [daemons, fuzz, prove]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-results-*'
      - name: fetch the published report (the history)
        run: |
          site=https://hobbyquaker.github.io/hm-radio-simulator
          mkdir -p previous
          # the main sweep records of the previous run, for the differential against the previously tested commit
          mkdir -p previous/sweep
          curl -fsSL "$site/sweep/main.json" -o previous/sweep/main.json || rm -f previous/sweep/main.json
          # the proof of the regression tests, kept when this run does not prove
          curl -fsSL "$site/proof.json" -o previous/proof.json || rm -f previous/proof.json
          if curl -fsSL "$site/history.json" -o previous/history.json; then
            for id in $(node -e 'console.log(JSON.parse(require("fs").readFileSync("previous/history.json","utf8")).map((e) => e.id).join(" "))'); do
              mkdir -p "previous/runs/$id"
              curl -fsSL "$site/runs/$id/index.html" -o "previous/runs/$id/index.html" || true
              curl -fsSL "$site/runs/$id/report.json" -o "previous/runs/$id/report.json" || true
            done
          else
            echo "no published history yet"
          fi
      - uses: actions/download-artifact@v4
        if: needs.prove.result != 'skipped'
        with:
          path: proofs
          pattern: 'proof-*'
      - name: judge the proof runs (or keep the published proof)
        run: |
          node scripts/prove.mjs collect proofs --previous previous/proof.json --out proof.json > proof.txt || true
          if [ -s proof.txt ]; then
            { echo '### Proof of the regression tests'; echo '```'; cat proof.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: build the report
        run: |
          node scripts/report.mjs collect --out site --previous previous --keep 20 --proof proof.json \
            --repo-sha "$GITHUB_SHA" --ref "$GITHUB_REF_NAME" --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --trigger "${{ inputs.trigger }}" artifacts
          cat site/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: site
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  # GitHub Pages (source "GitHub Actions"): https://hobbyquaker.github.io/hm-radio-simulator/
  deploy:
    name: publish the report
    runs-on: ubuntu-latest
    needs: report
    if: github.ref == 'refs/heads/main' && always() && needs.report.result == 'success'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
