name: CI

on:
  push:
    branches: ['**']
    # a push that changes only the READMEs or the issue drafts tests nothing new (the roadmap states are pushed often);
    # a push with any other file runs everything
    paths-ignore: ['README.md', 'README.en.md', 'upstream-reports/**']
  pull_request:
  workflow_dispatch:
    inputs:
      prove:
        description: also prove the regression tests on their fixes' parent commits (scripts/prove.mjs)
        type: boolean
        default: false
      tsan:
        description: also run the daemon suite under ThreadSanitizer on the heads (main, the fork's lite)
        type: boolean
        default: false
  # weekly: the whole suite, and the proof of the regression tests (the fixes' commits do not move, the harness does)
  schedule:
    - cron: '17 3 * * 0'
  # the upstream watch (upstream-watch.yml) runs the suite for a new OpenCCU-Base main commit through this workflow
  workflow_call:
    inputs:
      upstream_sha:
        description: the OpenCCU-Base commit to test in place of main
        type: string
        default: ''
      trigger:
        description: what triggered the run, shown on the report
        type: string
        default: ''

jobs:
  unit:
    name: lint and unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit

  # which OpenCCU-Base refs this run tests: upstream's newest release tag and main's head (or the upstream watch's
  # commit), and on openccu-lite's fork hobbyquaker/OpenCCU-Base its newest openccu-lite tag (v*) and the head of the
  # branch lite (scripts/refs.mjs FORK_REFS), each with its known-broken list derived from the fixes' commits -
  # ancestors, or picked onto the fork (scripts/resolve-refs.mjs)
  refs:
    name: OpenCCU-Base refs
    runs-on: ubuntu-latest
    outputs:
      daemons: ${{ steps.resolve.outputs.daemons }}
      fuzz: ${{ steps.resolve.outputs.fuzz }}
      prove: ${{ steps.prove.outputs.prove }}
      proof: ${{ steps.prove.outputs.proof }}
      tsan: ${{ steps.prove.outputs.tsan }}
      tsan_refs: ${{ steps.resolve.outputs.tsan }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: resolve
        run: node scripts/resolve-refs.mjs --main "${{ inputs.upstream_sha }}" --github-output
      # the proof of the regression tests costs two image builds per fix, so it runs only when it can change: weekly,
      # on request, and on a push that changes the fix list or a regression test (scripts/prove.mjs changed); never
      # for the upstream watch, whose new main commit does not touch the fixes' old commits
      - id: prove
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          DISPATCH: ${{ github.event.inputs.prove }}
          UPSTREAM: ${{ inputs.upstream_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          prove=false
          if [ -n "${UPSTREAM}" ]; then
            prove=false
          elif [ "${CRON}" = '17 3 * * 0' ] || [ "${DISPATCH}" = true ]; then
            prove=true
          elif [ "${EVENT}" = push ]; then
            if [ -z "${BEFORE}" ] || [ "${BEFORE}" = 0000000000000000000000000000000000000000 ] \
              || ! git fetch -q --depth=1 origin "${BEFORE}"; then
              prove=true
            elif node scripts/prove.mjs changed "${BEFORE}" "${GITHUB_SHA}"; then
              prove=true
            fi
          fi
          echo "prove=${prove}" >> "$GITHUB_OUTPUT"
          # ThreadSanitizer on the heads: as rare as the proof, or on its own request
          tsan=${prove}
          if [ -z "${UPSTREAM}" ] && [ "${{ github.event.inputs.tsan }}" = true ]; then tsan=true; fi
          echo "tsan=${tsan}" >> "$GITHUB_OUTPUT"
          if [ "${prove}" = true ]; then
            node scripts/prove.mjs plan --github-output
          fi

  daemons:
    name: daemon suite (OpenCCU-Base ${{ matrix.base_ref }}, ${{ matrix.variant }})
    needs: refs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.refs.outputs.daemons) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build the test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: test
          load: true
          tags: hm-radio-simulator:test
          build-args: |
            BASE_REPO=${{ matrix.base_repo }}
            BASE_REF=${{ matrix.build_ref }}
            BASE_LABEL=${{ matrix.base_ref }}
            KNOWN_BROKEN=${{ matrix.known_broken }}
          cache-from: type=gha,scope=base-${{ matrix.base_ref }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.base_ref }}
      - name: run the daemon suite
        run: |
          mkdir -p results
          docker run --rm --init --cap-add SYS_NICE -e HMRS_VARIANT=${{ matrix.variant }} -v "$PWD/results:/results" hm-radio-simulator:test npm run test:daemon
      - name: job summary
        if: always()
        run: node scripts/report.mjs summary results >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daemon-results-${{ matrix.base_ref }}-${{ matrix.variant }}
          path: results
          if-no-files-found: ignore

  fuzz:
    name: fuzz (OpenCCU-Base ${{ matrix.base_ref }})
    needs: refs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.refs.outputs.fuzz) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build the fuzz image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: fuzz
          load: true
          tags: hm-radio-simulator:fuzz
          build-args: |
            BASE_REPO=${{ matrix.base_repo }}
            BASE_REF=${{ matrix.build_ref }}
            BASE_LABEL=${{ matrix.base_ref }}
          cache-from: type=gha,scope=base-${{ matrix.base_ref }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.base_ref }}
      - name: run the harnesses (60 s each)
        run: |
          mkdir -p results/fuzz
          docker run --rm -e FUZZ_SECONDS=60 -e FUZZ_EXPECT_FINDINGS=${{ matrix.expect_findings }} -e FUZZ_KNOWN_HARNESSES=${{ matrix.known_harnesses }} -v "$PWD/results/fuzz:/results" hm-radio-simulator:fuzz
      - name: job summary
        if: always()
        run: node scripts/report.mjs summary results >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-results-${{ matrix.base_ref }}
          path: |
            results/fuzz
            !results/fuzz/corpus
          if-no-files-found: ignore

  # every test needs a short explanation for the report (test/descriptions.js); a test without one fails this job
  descriptions:
    name: every test has a description
    runs-on: ubuntu-latest
    needs: daemons
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: 'daemon-results-*'
      - run: node scripts/report.mjs check artifacts

  # the proof of the regression tests: each fix's tests on its merge commit's parent (they must fail) and on the merge
  # commit (they must pass), release and ASan - a fix that exists on the fork only on the fork commit's parent and the
  # fork commit, fetched from the fork; the report job judges the runs (scripts/prove.mjs)
  prove:
    name: 'proof (OpenCCU-Base #${{ matrix.fix }}, ${{ matrix.side }})'
    needs: refs
    if: needs.refs.outputs.prove == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.refs.outputs.proof) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@v3
      # no build cache: the old commits would push the refs' caches out of the 10 GB, and the build takes minutes
      - name: build the image at ${{ matrix.sha }}
        id: build
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: test
          load: true
          tags: hm-radio-simulator:proof
          build-args: |
            BASE_REPO=${{ matrix.repo }}
            BASE_REF=${{ matrix.sha }}
            BASE_LABEL=#${{ matrix.fix }} ${{ matrix.side }}
            DAEMON_VARIANTS=${{ matrix.daemon_variants }}
      - name: 'run the tests of #${{ matrix.fix }}'
        run: |
          node scripts/prove.mjs run --fix "${{ matrix.fix }}" --side "${{ matrix.side }}" --sha "${{ matrix.sha }}" \
            --image hm-radio-simulator:proof --out proof --known-broken "${{ matrix.known_broken }}" \
            --repeat "${{ matrix.repeat }}" --variants "${{ matrix.variants }}" ${{ steps.build.outcome != 'success' && '--build-failed' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof-${{ matrix.fix }}-${{ matrix.side }}
          path: proof/proof-run.json
          if-no-files-found: ignore

  # ThreadSanitizer: the daemon suite in the tsan variant on the heads (OpenCCU-Base main and the fork's lite - a tag
  # cannot change any more), on the weekly run or on request (workflow_dispatch input tsan); the daemons start without
  # address randomisation (setarch -R, test/helpers/daemon.js), which docker's default seccomp profile refuses - hence
  # seccomp=unconfined. The known races on the heads run as todo (test/helpers/known.js, the findings' names).
  tsan:
    name: daemon suite (OpenCCU-Base ${{ matrix.base_ref }}, tsan)
    needs: refs
    if: needs.refs.outputs.tsan == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.refs.outputs.tsan_refs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build the test image with the tsan variant
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: test
          load: true
          tags: hm-radio-simulator:tsan
          build-args: |
            BASE_REPO=${{ matrix.base_repo }}
            BASE_REF=${{ matrix.build_ref }}
            BASE_LABEL=${{ matrix.base_ref }}
            KNOWN_BROKEN=${{ matrix.known_broken }}
            DAEMON_VARIANTS=release asan tsan
          cache-from: type=gha,scope=base-${{ matrix.base_ref }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.base_ref }}
      - name: run the daemon suite under ThreadSanitizer
        run: |
          mkdir -p results
          docker run --rm --init --cap-add SYS_NICE --security-opt seccomp=unconfined -e HMRS_VARIANT=tsan \
            -e "HMRS_TEST_FILES=${TSAN_FILES}" -v "$PWD/results:/results" hm-radio-simulator:tsan npm run test:daemon
        env:
          # the files of the threaded paths: the LAN gateways of both daemons, the coprocessor protocol on the pty,
          # the serial errors (#115/#116), the receiver that vanishes (#27); the whole suite under tsan takes hours
          TSAN_FILES: test/daemon/rfd-lgw-front.test.js test/daemon/rfd-lgw-recovery.test.js test/daemon/rfd-lgw-hmlangw.test.js test/daemon/rfd-serial-errors.test.js test/daemon/rfd-rpc-robustness.test.js test/daemon/rfd-pty-module.test.js test/daemon/rfd-switch.test.js test/daemon/rfd-two-interfaces.test.js test/daemon/hs485d-lgw.test.js
      - name: job summary
        if: always()
        run: node scripts/report.mjs summary results >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daemon-results-${{ matrix.base_ref }}-tsan
          path: results
          if-no-files-found: ignore

  # the test report: the Markdown overview of the whole run and the site as an artifact, on every branch
  # (scripts/build-site.sh); main publishes it in the deploy job below
  report:
    name: test report
    runs-on: ubuntu-latest
    needs: [daemons, fuzz, prove, tsan]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-results-*'
      - uses: actions/download-artifact@v4
        if: needs.prove.result != 'skipped'
        with:
          path: proofs
          pattern: 'proof-*'
      - name: build the report
        env:
          TRIGGER: ${{ inputs.trigger }}
        run: SUMMARY="$GITHUB_STEP_SUMMARY" scripts/build-site.sh artifacts proofs site "$TRIGGER"
      - uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: site

  # GitHub Pages (source "GitHub Actions"): https://hobbyquaker.github.io/hm-radio-simulator/
  # Fetching the published history, building the site and deploying it are one job in one concurrency group, so
  # overlapping runs (a push and the upstream watch) publish one after another and each adds its entry to the history
  # the previous one published (B-2). GitHub keeps at most one run waiting per group: a third run that arrives while
  # one publishes and one waits replaces the waiting one, whose entry is then missing.
  deploy:
    name: publish the report
    runs-on: ubuntu-latest
    needs: [report, prove]
    if: github.ref == 'refs/heads/main' && always() && needs.report.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-results-*'
      - uses: actions/download-artifact@v4
        if: needs.prove.result != 'skipped'
        with:
          path: proofs
          pattern: 'proof-*'
      - name: build the report on the history published last
        env:
          TRIGGER: ${{ inputs.trigger }}
        run: scripts/build-site.sh artifacts proofs site "$TRIGGER"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
