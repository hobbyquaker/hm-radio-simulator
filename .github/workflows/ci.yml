name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  # the upstream watch (upstream-watch.yml) runs the suite for a new OpenCCU-Base main commit through this workflow
  workflow_call:
    inputs:
      upstream_sha:
        description: the OpenCCU-Base commit to test in place of main
        type: string
        default: ''
      trigger:
        description: what triggered the run, shown on the report
        type: string
        default: ''

jobs:
  unit:
    name: lint and unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit

  # which OpenCCU-Base refs this run tests: the two newest release tags and main's head (or the upstream watch's
  # commit), each with its known-broken list derived from the fixes' merge commits (scripts/resolve-refs.mjs)
  refs:
    name: OpenCCU-Base refs
    runs-on: ubuntu-latest
    outputs:
      daemons: ${{ steps.resolve.outputs.daemons }}
      fuzz: ${{ steps.resolve.outputs.fuzz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: resolve
        run: node scripts/resolve-refs.mjs --main "${{ inputs.upstream_sha }}" --github-output

  daemons:
    name: daemon suite (OpenCCU-Base ${{ matrix.base_ref }}, ${{ matrix.variant }})
    needs: refs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.refs.outputs.daemons) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build the test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: test
          load: true
          tags: hm-radio-simulator:test
          build-args: |
            BASE_REF=${{ matrix.build_ref }}
            BASE_LABEL=${{ matrix.base_ref }}
            KNOWN_BROKEN=${{ matrix.known_broken }}
          cache-from: type=gha,scope=base-${{ matrix.base_ref }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.base_ref }}
      - name: run the daemon suite
        run: |
          mkdir -p results
          docker run --rm --init --cap-add SYS_NICE -e HMRS_VARIANT=${{ matrix.variant }} -v "$PWD/results:/results" hm-radio-simulator:test npm run test:daemon
      - name: job summary
        if: always()
        run: node scripts/report.mjs summary results >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daemon-results-${{ matrix.base_ref }}-${{ matrix.variant }}
          path: results
          if-no-files-found: ignore

  fuzz:
    name: fuzz (OpenCCU-Base ${{ matrix.base_ref }})
    needs: refs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.refs.outputs.fuzz) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build the fuzz image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: fuzz
          load: true
          tags: hm-radio-simulator:fuzz
          build-args: |
            BASE_REF=${{ matrix.build_ref }}
            BASE_LABEL=${{ matrix.base_ref }}
          cache-from: type=gha,scope=base-${{ matrix.base_ref }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.base_ref }}
      - name: run the harnesses (60 s each)
        run: |
          mkdir -p results/fuzz
          docker run --rm -e FUZZ_SECONDS=60 -e FUZZ_EXPECT_FINDINGS=${{ matrix.expect_findings }} -e FUZZ_KNOWN_HARNESSES=${{ matrix.known_harnesses }} -v "$PWD/results/fuzz:/results" hm-radio-simulator:fuzz
      - name: job summary
        if: always()
        run: node scripts/report.mjs summary results >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-results-${{ matrix.base_ref }}
          path: |
            results/fuzz
            !results/fuzz/corpus
          if-no-files-found: ignore

  # every test needs a short explanation for the report (test/descriptions.js); a test without one fails this job
  descriptions:
    name: every test has a description
    runs-on: ubuntu-latest
    needs: daemons
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: 'daemon-results-*'
      - run: node scripts/report.mjs check artifacts

  # the test report: the Markdown overview of the whole run and the static site for GitHub Pages (scripts/report.mjs)
  report:
    name: test report
    runs-on: ubuntu-latest
    needs: [daemons, fuzz]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-results-*'
      - name: fetch the published report (the history)
        run: |
          site=https://hobbyquaker.github.io/hm-radio-simulator
          mkdir -p previous
          # the main sweep records of the previous run, for the differential against the previously tested commit
          mkdir -p previous/sweep
          curl -fsSL "$site/sweep/main.json" -o previous/sweep/main.json || rm -f previous/sweep/main.json
          if curl -fsSL "$site/history.json" -o previous/history.json; then
            for id in $(node -e 'console.log(JSON.parse(require("fs").readFileSync("previous/history.json","utf8")).map((e) => e.id).join(" "))'); do
              mkdir -p "previous/runs/$id"
              curl -fsSL "$site/runs/$id/index.html" -o "previous/runs/$id/index.html" || true
              curl -fsSL "$site/runs/$id/report.json" -o "previous/runs/$id/report.json" || true
            done
          else
            echo "no published history yet"
          fi
      - name: build the report
        run: |
          node scripts/report.mjs collect --out site --previous previous --keep 20 \
            --repo-sha "$GITHUB_SHA" --ref "$GITHUB_REF_NAME" --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --trigger "${{ inputs.trigger }}" artifacts
          cat site/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: site
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  # GitHub Pages (source "GitHub Actions"): https://hobbyquaker.github.io/hm-radio-simulator/
  deploy:
    name: publish the report
    runs-on: ubuntu-latest
    needs: report
    if: github.ref == 'refs/heads/main' && always() && needs.report.result == 'success'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
