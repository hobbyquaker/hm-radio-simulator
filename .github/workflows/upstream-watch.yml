name: upstream watch

# Runs the suite whenever one of the refs the report tests moves, in either repository (scripts/refs.mjs): on
# OpenCCU/OpenCCU-Base a new release tag or a new main commit, on openccu-lite's fork hobbyquaker/OpenCCU-Base a new
# openccu-lite release tag (vX.Y.Z) or pre-release tag (vX.Y.Z-dev.N and the like). GitHub has no cross-repository push trigger, so this polls both
# repositories every 15 minutes (`scripts/resolve-refs.mjs --heads`, git ls-remote: "<label> <commit>" per ref), keeps
# the last tested ones on the branch `upstream-state` (written only here: `last-tested-refs`) and, when one is new,
# runs the CI workflow - for main's exact commit, with all four refs as always. The report names what triggered it:
# "OpenCCU-Base <sha>" when main moved, else "<label> <sha>" of the first new ref (e.g. "lite@v1.0.0 <sha>"
# or "lite@v1.1.0-dev.5 <sha>"). Several moves within one interval are tested as their newest heads. The state commit
# also counts as repository activity, which keeps GitHub from disabling the schedule.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: run the suite even if the refs were tested already
        type: boolean
        default: false

concurrency:
  group: upstream-watch
  cancel-in-progress: false

# contents: the state branch; pages and id-token: the called CI workflow deploys the report (a called workflow's
# permissions cannot exceed the caller's)
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check:
    name: has a ref of OpenCCU-Base or of the fork moved?
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.compare.outputs.new }}
      sha: ${{ steps.compare.outputs.sha }}
      heads: ${{ steps.head.outputs.heads }}
      trigger: ${{ steps.compare.outputs.trigger }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: the refs of both repositories
        id: head
        run: |
          node scripts/resolve-refs.mjs --heads > heads.txt
          cat heads.txt
          # "<label> <sha>;" per ref
          echo "heads=$(tr '\n' ';' < heads.txt)" >> "$GITHUB_OUTPUT"
      - name: the last tested refs (branch upstream-state)
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          last=$(gh api "repos/$GITHUB_REPOSITORY/contents/last-tested-refs?ref=upstream-state" --jq .content 2>/dev/null | base64 -d || true)
          sha=$(sed -n 's/^main //p' heads.txt)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          new=false
          trigger=''
          if [ "$FORCE" = "true" ]; then
            new=true
            trigger="OpenCCU-Base $sha"
            echo "new: forced"
          fi
          while read -r label head; do
            [ -n "$label" ] || continue
            if ! printf '%s\n' "$last" | grep -qxF "$label $head"; then
              echo "new: $label at $head (not tested yet)"
              new=true
              # main's commit names the run when main moved; else the first new ref does
              if [ "$label" = main ]; then
                trigger="OpenCCU-Base $head"
              elif [ -z "$trigger" ]; then
                trigger="$label $head"
              fi
            fi
          done < heads.txt
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "trigger=$trigger" >> "$GITHUB_OUTPUT"
          [ "$new" = true ] || echo "nothing new since the last tested refs: $(printf '%s' "$last" | tr '\n' ' ')"

  suite:
    name: the suite for the new refs
    needs: check
    if: needs.check.outputs.new == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      upstream_sha: ${{ needs.check.outputs.sha }}
      trigger: ${{ needs.check.outputs.trigger }}

  record:
    name: remember the tested refs
    needs: [check, suite]
    if: always() && needs.check.outputs.new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: write the state branch
        env:
          SHA: ${{ needs.check.outputs.sha }}
          HEADS: ${{ needs.check.outputs.heads }}
          RESULT: ${{ needs.suite.result }}
        run: |
          git config user.name "upstream watch"
          git config user.email "actions@users.noreply.github.com"
          if git fetch origin upstream-state 2>/dev/null; then
            git checkout -q upstream-state
          else
            git checkout -q --orphan upstream-state
            git rm -rfq . >/dev/null 2>&1 || true
          fi
          printf '# upstream-state\n\nWritten by the upstream-watch workflow: the refs of OpenCCU-Base and of the fork hobbyquaker/OpenCCU-Base the suite ran for last (last-tested-refs, "<label> <commit>" per ref), and every run in history.\n' > README.md
          # one "<label> <sha>" line per ref; the files of the earlier watch (main and the fork branches) are gone
          printf '%s' "$HEADS" | tr ';' '\n' | sed '/^$/d' > last-tested-refs
          git rm -q --ignore-unmatch last-tested last-tested-forks
          printf '%s %s %s %s\n' "$(date -u +%FT%TZ)" "$SHA" "$RESULT" "$(printf '%s' "$HEADS" | tr ';' ' ' | sed 's/ *$//')" >> history
          git add README.md last-tested-refs history
          git commit -qm "refs ${HEADS%;}: suite $RESULT" || echo "nothing to commit"
          git push -q origin upstream-state
      - name: a failed upstream run
        if: needs.suite.result == 'failure'
        run: |
          echo "::warning title=OpenCCU-Base refs::the suite failed for ${{ needs.check.outputs.trigger }} - see the report. Opening an issue is not enabled (the maintainer decides)."
