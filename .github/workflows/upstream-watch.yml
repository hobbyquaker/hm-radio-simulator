name: upstream watch

# Runs the suite whenever OpenCCU-Base main or a fork branch of the report (scripts/refs.mjs FORK_REFS: openccu-lite's
# lite-3.89.11) moves. GitHub has no cross-repository push trigger, so this polls the heads every 15 minutes, keeps the
# last tested commits on the branch `upstream-state` (written only here: `last-tested` for main, `last-tested-forks`
# with "<label> <sha>" lines for the fork branches), and when a head is new runs the CI workflow for main's exact
# commit (labelled "main" on the report, with "triggered by OpenCCU-Base <sha>", or "triggered by <label> <sha>" when
# only a fork branch moved; the CI resolves the fork branches' heads itself). Several commits within one interval are
# tested as their newest head. The state commit also counts as repository activity, which keeps GitHub from disabling
# the schedule.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: run the suite even if the head was tested already
        type: boolean
        default: false

concurrency:
  group: upstream-watch
  cancel-in-progress: false

# contents: the state branch; pages and id-token: the called CI workflow deploys the report (a called workflow's
# permissions cannot exceed the caller's)
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check:
    name: is OpenCCU-Base main or a fork branch new?
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.compare.outputs.new }}
      sha: ${{ steps.head.outputs.sha }}
      forks: ${{ steps.head.outputs.forks }}
      trigger: ${{ steps.compare.outputs.trigger }}
      last: ${{ steps.compare.outputs.last }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: the heads of OpenCCU-Base main and the fork branches
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api repos/OpenCCU/OpenCCU-Base/commits/main --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "OpenCCU-Base main is at $sha"
          # "<label> <owner/repo> <branch>" per fork branch of the report
          forks=''
          while read -r label repo branch; do
            [ -n "$label" ] || continue
            head=$(gh api "repos/$repo/commits/$branch" --jq .sha)
            echo "$label ($repo $branch) is at $head"
            forks="${forks}${label} ${head};"
          done < <(node --input-type=module -e "import {FORK_REFS} from './scripts/refs.mjs'; for (const f of FORK_REFS) console.log(f.label, f.repo.replace(/^https:\/\/github\.com\//, '').replace(/\.git\$/, ''), f.ref);")
          echo "forks=$forks" >> "$GITHUB_OUTPUT"
      - name: the last tested commits (branch upstream-state)
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.head.outputs.sha }}
          FORKS: ${{ steps.head.outputs.forks }}
        run: |
          last=$(gh api "repos/$GITHUB_REPOSITORY/contents/last-tested?ref=upstream-state" --jq .content 2>/dev/null | base64 -d | tr -d '[:space:]' || true)
          lastForks=$(gh api "repos/$GITHUB_REPOSITORY/contents/last-tested-forks?ref=upstream-state" --jq .content 2>/dev/null | base64 -d || true)
          echo "last=$last" >> "$GITHUB_OUTPUT"
          new=false
          trigger="OpenCCU-Base $SHA"
          if [ "${{ inputs.force }}" = "true" ] || [ "$last" != "$SHA" ]; then
            new=true
            echo "new: main last tested ${last:-none}, head $SHA"
          fi
          IFS=';' read -ra entries <<< "$FORKS"
          for entry in "${entries[@]}"; do
            [ -n "$entry" ] || continue
            if ! printf '%s\n' "$lastForks" | grep -qxF "$entry"; then
              echo "new: ${entry% *} at ${entry#* } (not tested yet)"
              # main's commit names the run when main moved too; else the fork branch does
              [ "$new" = true ] || trigger="$entry"
              new=true
            fi
          done
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "trigger=$trigger" >> "$GITHUB_OUTPUT"
          [ "$new" = true ] || echo "nothing new since main $last and ${lastForks:-no fork branch}"

  suite:
    name: the suite for the new commit
    needs: check
    if: needs.check.outputs.new == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      upstream_sha: ${{ needs.check.outputs.sha }}
      trigger: ${{ needs.check.outputs.trigger }}

  record:
    name: remember the tested commit
    needs: [check, suite]
    if: always() && needs.check.outputs.new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: write the state branch
        env:
          SHA: ${{ needs.check.outputs.sha }}
          FORKS: ${{ needs.check.outputs.forks }}
          RESULT: ${{ needs.suite.result }}
        run: |
          git config user.name "upstream watch"
          git config user.email "actions@users.noreply.github.com"
          if git fetch origin upstream-state 2>/dev/null; then
            git checkout -q upstream-state
          else
            git checkout -q --orphan upstream-state
            git rm -rfq . >/dev/null 2>&1 || true
            printf '# upstream-state\n\nWritten by the upstream-watch workflow: the OpenCCU-Base main commit the suite ran for last.\n' > README.md
            git add README.md
          fi
          echo "$SHA" > last-tested
          # one "<label> <sha>" line per fork branch
          printf '%s' "$FORKS" | tr ';' '\n' | sed '/^$/d' > last-tested-forks
          printf '%s %s %s%s\n' "$(date -u +%FT%TZ)" "$SHA" "$RESULT" "$(printf '%s' "$FORKS" | tr ';' ' ' | sed 's/ *$//; s/^./ &/')" >> history
          git add last-tested last-tested-forks history
          git commit -qm "OpenCCU-Base main $SHA, ${FORKS%;}: suite $RESULT" || echo "nothing to commit"
          git push -q origin upstream-state
      - name: a failed upstream run
        if: needs.suite.result == 'failure'
        run: |
          echo "::warning title=OpenCCU-Base main ${{ needs.check.outputs.sha }}::the suite failed for this upstream commit - see the report. Opening an issue is not enabled (the maintainer decides)."
